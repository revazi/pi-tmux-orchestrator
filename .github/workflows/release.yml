name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm package and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install release tooling
        run: |
          python -m pip install --disable-pip-version-check ruff==0.11.11
          npm install --global --ignore-scripts npm@11.6.2

      - name: Ensure tmux is available
        timeout-minutes: 5
        run: scripts/ensure-tmux.sh

      - name: Verify tag, version, and changelog
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$(tr -d '\n' < VERSION)" = "$package_version"
          test "$(python -c 'from pi_tmux_orchestrator.constants import VERSION; print(VERSION)')" = "$package_version"
          grep -F "## $package_version - " CHANGELOG.md
          release_notes="releases/v$package_version.md"
          test -f "$release_notes"
          grep -F "## Breaking change" "$release_notes"
          grep -F "## Upgrade safely" "$release_notes"
          test -z "$(git status --porcelain)"
          test "$(npm --version)" = "11.6.2"

      - name: Run release verification
        run: scripts/test.sh

      - name: Publish or verify npm package
        run: python3 scripts/release_npm.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; continuing."
          else
            release_notes="releases/$GITHUB_REF_NAME.md"
            test -f "$release_notes"
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Pi Tmux Orchestrator $GITHUB_REF_NAME" \
              --notes-file "$release_notes" \
              --latest
          fi
